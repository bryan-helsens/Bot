# Paper-trading strategy config for Binance TESTNET.
#
# Copy to config/strategies.yaml (the path STRATEGIES_CONFIG points at) to use:
#     cp config/strategies.paper.example.yaml config/strategies.yaml
#
# ⚠️ This is a config UNDER TEST, not a proven-profitable one. No daily config was
# profitable under realistic fills (see docs/REALISTIC_FILLS_REPORT.md). The POINT
# of paper-trading is to gather REAL live-execution data — where stops fill near
# their level on short candles — to find out honestly whether any edge exists.
# Run it on intraday timeframes (5m/15m) so:
#   * stops fill close to their price (the realistic-execution regime), and
#   * enough trades accrue in days, not months, to judge it.
#
# Risk is deliberately SMALL and conservative (see the matching .env block in
# docs/TESTNET_PAPER_TRADING.md). Start here; only widen after weeks of clean runs.

strategies:
  # Strategy 1 — RSI mean-reversion: buy oversold bounces, exit on overbought /
  # take-profit / stop. oversold=40 (not 30/35) so the cross-up fires more often
  # during a test — you gather pipeline data in hours, not days. Tighten back to
  # 30-35 once you've confirmed the signal→order→stop→exit path end-to-end.
  - name: rsi_dip_buyer
    class: RSIStrategy
    market: spot
    enabled: true
    # symbols: [] means "trade EVERY symbol the engine streams" — i.e. whatever you
    # list in SYMBOLS in .env. So to add/remove coins you edit ONE place (.env),
    # not here. The engine skips any symbol the testnet doesn't list.
    symbols: []
    timeframes: [5m, 15m]
    params:
      period: 14
      # 32 (not 40): only buy genuinely oversold dips. 40 fired too often and,
      # combined with exiting on every opposite signal, over-traded into fees.
      oversold: 32
      overbought: 70

  # Strategy 2 — EMA trend follower. DISABLED after live data: over a 100-trade
  # testnet run it scored 19% win rate, profit factor 0.14 and lost -2.45 USDT —
  # it caused ~72% of the total loss while RSI alone was near break-even (PF 0.90).
  # Re-enable only if you re-validate it; trend-following on 5m chop bleeds.
  - name: ema_trend
    class: EMACrossoverStrategy
    market: spot
    enabled: false
    symbols: []
    timeframes: [5m, 15m]
    params:
      fast_period: 9
      slow_period: 21
      # Tiny noise filter: ignore crosses where the EMAs are basically touching.
      min_gap_pct: 0.0005

