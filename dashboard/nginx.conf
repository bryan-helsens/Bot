# nginx config serving the built SPA and proxying API/WebSocket to the backend.
# The backend host is configurable via the API_HOST build/runtime arg; default
# assumes the docker-compose service name "api".

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page-app routing: serve index.html for unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy REST API calls to the FastAPI backend.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy WebSocket connections (upgrade handshake).
    location /ws {
        proxy_pass http://api:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Cache static assets aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
