[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "quantbot"
version = "1.0.0"
description = "Professional asynchronous cryptocurrency trading bot for Binance (Spot, Futures, Testnet)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "QuantBot Team" }]
keywords = ["trading", "binance", "crypto", "algotrading", "backtesting", "quant"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]

# ---------------------------------------------------------------------------
# Core runtime dependencies (always required to run the live/paper engine).
# ---------------------------------------------------------------------------
dependencies = [
    # Async HTTP / WebSocket clients
    "aiohttp>=3.10,<4.0",
    "websockets>=13.0,<14.0",
    "httpx>=0.27,<0.29",
    # Configuration & validation
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "python-dotenv>=1.0,<2.0",
    "PyYAML>=6.0,<7.0",
    # Numerical / data
    "numpy>=2.0,<3.0",
    "pandas>=2.2,<3.0",
    # Database (async PostgreSQL) + migrations
    "SQLAlchemy[asyncio]>=2.0.30,<2.1",
    "asyncpg>=0.29,<0.31",
    "alembic>=1.13,<2.0",
    # Cache / pub-sub
    "redis>=5.0,<6.0",
    # Logging
    "structlog>=24.4,<25.0",
    # Security
    "cryptography>=43.0,<44.0",
    # CLI
    "typer>=0.12,<0.16",
    "rich>=13.7,<14.0",
    # Time / scheduling
    "python-dateutil>=2.9,<3.0",
]

[project.optional-dependencies]
# FastAPI monitoring backend.
api = [
    "fastapi>=0.114,<0.116",
    "uvicorn[standard]>=0.30,<0.35",
    "python-multipart>=0.0.9",
    "PyJWT>=2.9,<3.0",
]

# Notifications (Telegram / Discord / Email).
notify = [
    "aiosmtplib>=3.0,<4.0",
]

# Optional AI / Machine-Learning module.
ai = [
    "scikit-learn>=1.5,<2.0",
    "xgboost>=2.1,<3.0",
    "lightgbm>=4.5,<5.0",
    "torch>=2.4,<3.0",
    "joblib>=1.4,<2.0",
]

# Parameter optimisation.
optimize = [
    "optuna>=3.6,<5.0",
    "scipy>=1.14,<2.0",
]

# Backtest reporting (interactive charts).
report = [
    "plotly>=5.23,<6.0",
    "jinja2>=3.1,<4.0",
    "pyarrow>=17.0,<19.0",
]

# Development / testing tooling.
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=5.0,<6.0",
    "pytest-mock>=3.14,<4.0",
    "aioresponses>=0.7,<0.8",
    "fakeredis>=2.24,<3.0",
    "ruff>=0.6,<0.10",
    "mypy>=1.11,<2.0",
    "types-PyYAML>=6.0",
    "types-python-dateutil>=2.9",
]

# Convenience meta-extra installing every optional component.
all = [
    "quantbot[api,notify,ai,optimize,report]",
]

[project.scripts]
quantbot = "quantbot.cli:app"

[project.urls]
Homepage = "https://github.com/bryan-helsens/Bot"
Documentation = "https://github.com/bryan-helsens/Bot/tree/main/docs"
Repository = "https://github.com/bryan-helsens/Bot"

# ---------------------------------------------------------------------------
# Hatch build configuration.
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["src/quantbot"]

[tool.hatch.build.targets.sdist]
include = ["src/quantbot", "README.md", "LICENSE", "docs"]

# ---------------------------------------------------------------------------
# Ruff (linter + formatter).
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",          # pyflakes
    "I",          # isort
    "N",          # pep8-naming
    "UP",         # pyupgrade
    "B",          # flake8-bugbear
    "C4",         # comprehensions
    "SIM",        # flake8-simplify
    "ASYNC",      # flake8-async
    "RUF",        # ruff-specific
    "TID",        # tidy-imports
    "PTH",        # use pathlib
    "PL",         # pylint subset
]
ignore = [
    "PLR0913",    # too many arguments (domain constructors are wide by nature)
    "PLR2004",    # magic value comparisons (common in indicator math)
    "B008",       # function call in default arg (FastAPI Depends pattern)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004", "N802", "PLR0913"]

[tool.ruff.lint.isort]
known-first-party = ["quantbot"]

# ---------------------------------------------------------------------------
# Mypy (static typing).
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
# Third-party libraries that ship without type stubs.
module = [
    "xgboost.*", "lightgbm.*", "sklearn.*", "optuna.*",
    "plotly.*", "joblib.*", "fakeredis.*", "aioresponses.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "unit: fast isolated unit tests",
    "integration: tests requiring external services (db/redis/exchange)",
    "slow: long-running tests (backtests/optimisation)",
]

[tool.coverage.run]
branch = true
source = ["src/quantbot"]
omit = ["*/__main__.py", "*/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
]
